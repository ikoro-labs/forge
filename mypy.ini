# Configuration de `mypy` (voir docs/agents/usine.md, clé `ci-replay`).
[mypy]
python_version = 3.10
files = plugins/forge, tests
# Les tests ajoutent les dossiers du plugin au chemin d'import (tests/support.py) : mypy les
# résout par ces mêmes dossiers.
mypy_path = plugins/forge/hooks:plugins/forge/scripts:tests
explicit_package_bases = True
warn_unused_ignores = True
warn_redundant_casts = True

# Les API de Windows (`ctypes.WinDLL`, `subprocess.DETACHED_PROCESS`...) n'existent pas dans les
# stubs d'un mypy lancé sous Linux, et ces modules les choisissent à l'exécution (`WINDOWS`), pas
# par `sys.platform` que mypy sait lire. La CI de ce dépôt n'a qu'un job `lint`, sous Linux.
[mypy-handoff_header]
disable_error_code = attr-defined, name-defined

[mypy-handoff_relay,test_handoff]
disable_error_code = attr-defined
