<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>forge</title>
  <defs>
    <radialGradient id="fond" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2B2F38"/>
      <stop offset="1" stop-color="#14161B"/>
    </radialGradient>
    <linearGradient id="acier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E8EE"/>
      <stop offset="1" stop-color="#8E97A3"/>
    </linearGradient>
    <linearGradient id="braise" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF6B1A"/>
    </linearGradient>
    <!-- Dans le repère de l'élément qui emploie le dégradé (userSpaceOnUse) : celui des
         étincelles, après les translate de leurs groupes, où elles vont de y=200 à y=372.
         Une ligne verticale n'a pas de largeur, et un dégradé rapporté à sa boîte ne s'y
         peindrait pas. -->
    <linearGradient id="etincelle" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="380">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF6B1A"/>
    </linearGradient>
    <radialGradient id="lueur" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF8A2B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF8A2B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#fond)"/>
  <g transform="translate(12 30)">
    <g transform="translate(20 0)">
      <ellipse cx="560" cy="420" rx="260" ry="180" fill="url(#lueur)"/>
      <g stroke="url(#etincelle)" stroke-width="26" stroke-linecap="round" fill="none">
        <line x1="560" y1="330" x2="560" y2="200"/>
        <line x1="500" y1="340" x2="410" y2="240"/>
        <line x1="620" y1="340" x2="710" y2="240"/>
        <line x1="460" y1="372" x2="350" y2="330"/>
        <line x1="660" y1="372" x2="770" y2="330"/>
      </g>
      <rect x="460" y="392" width="200" height="48" rx="20" fill="url(#braise)"/>
    </g>
    <path fill="url(#acier)" d="M150 458 Q240 440 330 440 L850 440 L850 512 L748 512 Q680 532 680 640 L750 640 L800 734 L360 734 L410 640 L480 640 Q480 532 410 512 L330 512 Q240 496 150 458 Z"/>
  </g>
</svg>
